  <text x="504.6" y="282.0" text-anchor="middle" class="node-body">Cloud Run · instance-local</text>
  <text x="504.6" y="304.0" text-anchor="middle" class="node-body">SQLite</text>
  <rect class="node" data-node-id="api" data-status="implemented" x="359.8" y="483.0" width="289.7" height="150.0" rx="22" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/>
  <text x="504.6" y="518.0" text-anchor="middle" class="node-title">Hono API boundary</text>
  <text x="504.6" y="549.0" text-anchor="middle" class="node-body">shared-secret dashboard</text>
  <text x="504.6" y="571.0" text-anchor="middle" class="node-body">requests</text>
  <text x="504.6" y="593.0" text-anchor="middle" class="node-body">signed Twilio traffic + caller</text>
  <text x="504.6" y="615.0" text-anchor="middle" class="node-body">match</text>
  <rect class="node" data-node-id="ingestion" data-status="implemented" x="737.4" y="194.0" width="389.6" height="128.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="932.2" y="229.0" text-anchor="middle" class="node-title">Multimodal guide ingestion</text>
  <text x="932.2" y="260.0" text-anchor="middle" class="node-body">text + documents pass through</text>
  <text x="932.2" y="282.0" text-anchor="middle" class="node-body">Gemini extracts image, audio, video</text>
  <text x="932.2" y="304.0" text-anchor="middle" class="node-body">context</text>
