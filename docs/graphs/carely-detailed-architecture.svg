  <text x="1371.5" y="573.0" text-anchor="middle" class="node-body">Twilio mu-law ↔ PCM ↔ Gemini Live</text>
  <text x="1371.5" y="595.0" text-anchor="middle" class="node-body">simple Hindi or English · one</text>
  <text x="1371.5" y="617.0" text-anchor="middle" class="node-body">idea at a time</text>
  <rect class="node" data-node-id="review" data-status="implemented" x="1215.0" y="646.0" width="313.0" height="128.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1371.5" y="681.0" text-anchor="middle" class="node-title">Reviewed call evidence</text>
  <text x="1371.5" y="712.0" text-anchor="middle" class="node-body">transcript + sources + actions</text>
  <text x="1371.5" y="734.0" text-anchor="middle" class="node-body">resolution · accuracy · clarity ·</text>
  <text x="1371.5" y="756.0" text-anchor="middle" class="node-body">tone · safety</text>
  <rect x="54" y="844" width="1492" height="36" rx="14" fill="#f5f5f4" stroke="#d6d3d1"/>
