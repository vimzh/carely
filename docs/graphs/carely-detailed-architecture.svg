<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="a0412a6cac144abf484c934585fa3255256b9b9d80dd93abef94e3deeb5b9b11">
  <title id="title">Carely system architecture</title>
  <desc id="description">Detailed architecture of Carely showing family and elder entry points, the Next.js and Hono Cloud Run services, multimodal guide ingestion, owner-keyed Gemini File Search, Google ADK orchestration, live voice delivery, reminders, and reviewed conversation outcomes.</desc>
