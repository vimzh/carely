<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="925829ee3e6182bb5ddfc896d9437104aaa3731bb5bf506ec535f3def247d4c5">
  <title id="title">How Carely learns and answers</title>
  <desc id="description">Flowchart showing Carely guide ingestion, multimodal understanding, Gemini File Search memory, the default-deny retrieval gate, Google Search, text and voice agents, and the final elder-friendly answer.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#57534e"/></marker>
    <style>
      text { font-family: "Comic Sans MS", "Segoe Print", cursive; }
      .title { font-size: 36px; fill: #292524; }
      .subtitle { font-size: 17px; fill: #78716c; }
      .zone-label { font-size: 14px; letter-spacing: 1px; }
      .node-title { font-size: 20px; fill: #292524; }
      .node-body { font-size: 15px; fill: #44403c; }
      .node-note { font-size: 13px; fill: #57534e; }
      .edge-label { font-size: 13px; fill: #57534e; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
      .footer { font-size: 13px; fill: #57534e; }
      .arrow { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="54" y="62" class="title">How Carely learns and answers</text>
  <text x="54" y="94" class="subtitle">Guide files become keyed family memory; a retrieval gate decides whether each text or voice question needs it</text>
  <rect data-zone-id="teach" x="42.0" y="130" width="453.8" height="690" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="62.0" y="160" class="zone-label" fill="#1e40af">1 · THE FAMILY TEACHES CARELY</text>
  <rect data-zone-id="decide" x="523.8" y="130" width="532.7" height="690" rx="28" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="543.8" y="160" class="zone-label" fill="#5b21b6">2 · MEMORY + RETRIEVAL DECISION</text>
  <rect data-zone-id="answer" x="1084.5" y="130" width="473.5" height="690" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1104.5" y="160" class="zone-label" fill="#166534">3 · CARELY ANSWERS</text>
  <path class="arrow" data-edge="guide--understand" d="M268.9 326.0 V352.0" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="arrow" data-edge="understand--memory" d="M465.8 408.0 H509.8 V258.0 H553.8" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="forget--memory" d="M465.8 558.0 H509.8 V258.0 H553.8" stroke="#e11d48" marker-end="url(#arrow-rose)"/>
  <path class="arrow" data-edge="memory--gate" d="M790.1 315.0 V330.5" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="gate--agent" d="M1026.5 408.0 C1057.3 408.0 1083.7 408.0 1114.5 408.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="web--agent" d="M1321.2 328.0 V342.0" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <path class="arrow" data-edge="agent--response" d="M1321.2 474.0 V494.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <rect class="node" data-node-id="guide" data-status="external" x="72.0" y="190.0" width="393.8" height="136.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="268.9" y="225.0" text-anchor="middle" class="node-title">A child adds a guide</text>
  <text x="268.9" y="256.0" text-anchor="middle" class="node-body">written steps · PDFs · notes</text>
  <text x="268.9" y="278.0" text-anchor="middle" class="node-body">images · audio · one short video</text>
  <text x="268.9" y="308.0" text-anchor="middle" class="node-note">Type, size, and video length are checked first</text>
  <rect class="node" data-node-id="understand" data-status="implemented" x="72.0" y="352.0" width="393.8" height="112.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="268.9" y="387.0" text-anchor="middle" class="node-title">Media becomes usable guidance</text>
  <text x="268.9" y="418.0" text-anchor="middle" class="node-body">images map visible controls</text>
  <text x="268.9" y="440.0" text-anchor="middle" class="node-body">audio and video become ordered context</text>
  <rect class="node" data-node-id="forget" data-status="implemented" x="72.0" y="491.5" width="393.8" height="133.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="268.9" y="526.5" text-anchor="middle" class="node-title">Edits replace; deletes forget</text>
  <text x="268.9" y="557.5" text-anchor="middle" class="node-body">the same guide key identifies its slice</text>
  <text x="268.9" y="587.5" text-anchor="middle" class="node-note">Old matching documents are removed after</text>
  <text x="268.9" y="606.5" text-anchor="middle" class="node-note">replacement</text>
  <rect class="node" data-node-id="memory" data-status="external" x="553.8" y="201.0" width="472.7" height="114.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="790.1" y="236.0" text-anchor="middle" class="node-title">Gemini File Search holds context</text>
  <text x="790.1" y="267.0" text-anchor="middle" class="node-body">care profiles + guides + native documents · keyed by source</text>
  <text x="790.1" y="297.0" text-anchor="middle" class="node-note">Each signed-in family has an isolated File Search store</text>
  <rect class="node" data-node-id="gate" data-status="implemented" x="553.8" y="330.5" width="472.7" height="155.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="790.1" y="365.5" text-anchor="middle" class="node-title">Every question passes a retrieval gate</text>
  <text x="790.1" y="396.5" text-anchor="middle" class="node-body">basic or general → skip memory</text>
  <text x="790.1" y="418.5" text-anchor="middle" class="node-body">family-specific → retrieve relevant context</text>
  <text x="790.1" y="448.5" text-anchor="middle" class="node-note">Time, date, arithmetic, weather, and greetings never touch</text>
  <text x="790.1" y="467.5" text-anchor="middle" class="node-note">family memory</text>
  <rect class="node" data-node-id="web" data-status="external" x="1114.5" y="188.0" width="413.5" height="140.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1321.2" y="223.0" text-anchor="middle" class="node-title">Current public facts can use</text>
  <text x="1321.2" y="249.0" text-anchor="middle" class="node-title">Google Search</text>
  <text x="1321.2" y="280.0" text-anchor="middle" class="node-body">weather · news · public services</text>
  <text x="1321.2" y="310.0" text-anchor="middle" class="node-note">Used only when the answer depends on current facts</text>
  <rect class="node" data-node-id="agent" data-status="implemented" x="1114.5" y="342.0" width="413.5" height="132.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1321.2" y="377.0" text-anchor="middle" class="node-title">Google ADK runs the text or live</text>
  <text x="1321.2" y="403.0" text-anchor="middle" class="node-title">voice agent</text>
  <text x="1321.2" y="434.0" text-anchor="middle" class="node-body">Gemini follows the elder-friendly prompt</text>
  <text x="1321.2" y="456.0" text-anchor="middle" class="node-body">retrieved facts stay reference data</text>
  <rect class="node" data-node-id="response" data-status="implemented" x="1114.5" y="494.0" width="413.5" height="128.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1321.2" y="529.0" text-anchor="middle" class="node-title">The elder gets a calm answer</text>
  <text x="1321.2" y="560.0" text-anchor="middle" class="node-body">one idea at a time · simple language</text>
  <text x="1321.2" y="582.0" text-anchor="middle" class="node-body">missing family or medicine details are not</text>
  <text x="1321.2" y="604.0" text-anchor="middle" class="node-body">invented</text>
  <rect x="54" y="844" width="1492" height="36" rx="14" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="800" y="868" text-anchor="middle" class="footer">Family memory is read only during conversations and is skipped for basic or general questions.</text>
</svg>
